[project]
name = "mesh-python"
version = "0.1.0"
description = "Python reference implementation of the Lange Labs Mesh protocol."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psutil>=7,<8",
    "pydantic>=2.0,<3",
    "pyserial>=3.5,<4",
    "websockets>=15,<18",
]

[tool.poetry]
packages = [{ include = "mesh" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = ["pytest>=8.4.2,<9.0.0", "ruff>=0.17.6,<0.18"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
